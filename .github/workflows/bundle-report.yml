name: Next.js Bundle Report

on:
  workflow_run:
    workflows: [Next.js Bundle Snapshot]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  report:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report Webpack comparison
        uses: Seojunhwan/nextjs-bundle-actions/actions/report@b58f448d9607c8f4946cb651ed6046c94048ed10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          project-id: web-webpack
          config-path: .github/nextjs-bundle-actions.yml

      - name: Report Turbopack comparison
        uses: Seojunhwan/nextjs-bundle-actions/actions/report@b58f448d9607c8f4946cb651ed6046c94048ed10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          project-id: web-turbopack
          config-path: .github/nextjs-bundle-actions.yml
