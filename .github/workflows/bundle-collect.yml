name: Next.js Bundle Snapshot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next build --webpack

      - uses: Seojunhwan/nextjs-bundle-actions/actions/collect@7f39f962a36f5db2d4203b36a29f1e4ae1ea6662
        with:
          build-path: .next
          project-id: web
          strict: true
