name: Next.js Bundle Snapshot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build web with Webpack through Turborepo
        run: pnpm turbo run build:webpack --filter=web

      - name: Collect Webpack snapshot
        uses: Seojunhwan/nextjs-bundle-actions/actions/collect@8197e1755acc0dfbf9360298fff937d699b927d7
        with:
          build-path: apps/web/.next
          project-id: web-webpack
          strict: true

      - name: Build web with Turbopack through Turborepo
        run: pnpm turbo run build --filter=web

      - name: Collect Turbopack snapshot
        uses: Seojunhwan/nextjs-bundle-actions/actions/collect@8197e1755acc0dfbf9360298fff937d699b927d7
        with:
          build-path: apps/web/.next
          project-id: web-turbopack
          strict: true
